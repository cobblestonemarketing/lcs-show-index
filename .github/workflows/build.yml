name: Build show index
on:
  schedule:
    - cron: '17 9 * * *'   # daily, 4:17am Central
  workflow_dispatch:
permissions:
  contents: write
concurrency: build
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
      - name: Commit if changed
        run: |
          git config user.name "lcs-show-index"
          git config user.email "actions@users.noreply.github.com"
          git add shows.json summary.json m
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Show index $(date -u +%F)"
          git push
          for f in $(git diff --name-only HEAD~1 HEAD -- m shows.json); do
            curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" || true
          done
